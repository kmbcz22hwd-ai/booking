<script>
  (function () {
    var ua = navigator.userAgent || "";
    var isInApp = /FBAN|FBAV|Instagram|Line\//i.test(ua);
    var hintEl = document.getElementById("inapp-hint");
    if (isInApp && hintEl) {
      hintEl.innerHTML = '<div class="inapp-warning">偵測到你是用 Facebook / Instagram / LINE 內建瀏覽器打開的，這種瀏覽器有時候會卡住連不上。<br><br>請點畫面右上角或右下角的「⋯」或分享圖示，選「在瀏覽器中開啟」（Open in Safari / Chrome），會比較穩定。</div>';
    }
    setTimeout(function () {
      var appEl = document.getElementById("app");
      if (appEl && appEl.innerHTML.indexOf("載入中") !== -1 && hintEl && !isInApp) {
        if (navigator.onLine === false) {
          hintEl.innerHTML = '<div class="inapp-warning">偵測到目前沒有網路連線。請確認 Wi-Fi 或行動數據已開啟，網路恢復後畫面會自動載入。</div>';
        } else {
          hintEl.innerHTML = '<div class="inapp-warning">載入時間比較久，可能是網路不穩或瀏覽器擋住了連線。建議：確認網路連線，或換成 Safari / Chrome 開啟這個網址再試一次。</div>';
        }
      }
    }, 6000);

    function updateOfflineBanner() {
      var banner = document.getElementById("offline-banner");
      if (!banner) return;
      banner.style.display = navigator.onLine === false ? "flex" : "none";
    }
    window.addEventListener("online", updateOfflineBanner);
    window.addEventListener("offline", updateOfflineBanner);
    updateOfflineBanner();

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("./sw.js").catch(function (e) {
          console.error("SW register failed", e);
        });
      });
    }
  })();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, addDoc, getDocs,
  query, where, orderBy, limit, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== Firebase 設定：換成你自己的 firebaseConfig ======
const firebaseConfig = {
  apiKey: "AIzaSyDkLms4g5-UPuMQcFl0pvxGU8bsqdLEqA0",
  authDomain: "sian-customer-records.firebaseapp.com",
  projectId: "sian-customer-records",
  storageBucket: "sian-customer-records.firebasestorage.app",
  messagingSenderId: "408702062626",
  appId: "1:408702062626:web:5317965599bd8678feba7b",
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

// ====== 常數 ======
const WEEKDAYS = ["日", "一", "二", "三", "四", "五", "六"];
const WEEKDAY_KEYS = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
const DEFAULT_SCHEDULE = {
  sun: { open: false, windows: "" },
  mon: { open: true, windows: "10:00-12:00,18:30-21:00" },
  tue: { open: true, windows: "10:00-21:00" },
  wed: { open: true, windows: "10:00-21:00" },
  thu: { open: true, windows: "10:00-21:00" },
  fri: { open: true, windows: "10:00-12:00,18:30-21:00" },
  sat: { open: true, windows: "09:00-12:00,18:30-21:00" },
};
// 時長選項改為後台可自訂，不再寫死；預設值見 S.durations
const SEGMENTS = [
  { key: "morning", label: "早上 10-12", start: 600, end: 720 },
  { key: "afternoon", label: "下午 12-18", start: 720, end: 1080 },
  { key: "evening", label: "晚上 18-22", start: 1080, end: 1320 },
];
const ALWAYS_OPEN_SCHEDULE = WEEKDAY_KEYS.reduce((acc, k) => { acc[k] = { open: true, windows: "00:00-23:59" }; return acc; }, {});
function isDateFullyClosed(closedDates, dateStr) {
  const segs = closedDates[dateStr];
  if (!segs || segs.length === 0) return false;
  return segs.includes("full") || (segs.includes("morning") && segs.includes("afternoon") && segs.includes("evening"));
}

// ====== 工具函式 ======
const pad = (n) => String(n).padStart(2, "0");
const toDateStr = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const timeToMin = (t) => { const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const minToTime = (m) => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const parseWindows = (str) => (str || "").split(",").map(s => s.trim()).filter(Boolean)
  .map(s => { const [start, end] = s.split("-").map(x => x.trim()); return { start, end }; })
  .filter(w => w.start && w.end);
const genId = (p = "") => p + Math.random().toString(36).slice(2, 8).toUpperCase();
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function formatDateCN(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}月${d.getDate()}日（${WEEKDAYS[d.getDay()]}）`;
}
function googleCalendarLink(b) {
  const startMin = timeToMin(b.start);
  const endMin = startMin + b.duration;
  const y = b.date.replace(/-/g, "");
  const fmt = (m) => y + "T" + pad(Math.floor(m / 60)) + pad(m % 60) + "00";
  const dates = `${fmt(startMin)}/${fmt(endMin)}`;
  const text = encodeURIComponent(`${b.name} - 顯德筋絡調理室${b.therapistName ? "（" + b.therapistName + "）" : ""}`);
  const details = encodeURIComponent(`客人：${b.name}\n電話：${b.phone}${b.price != null ? "\n金額：$" + b.price : ""}${b.note ? "\n備註：" + b.note : ""}`);
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${dates}&details=${details}`;
}
function generateSlots(dateStr, durationMin, schedule, bookings, therapistId, closedSegs, blocks) {
  const d = new Date(dateStr + "T00:00:00");
  const wk = WEEKDAY_KEYS[d.getDay()];
  const daySchedule = schedule[wk];
  if (!daySchedule || !daySchedule.open) return [];
  const windows = parseWindows(daySchedule.windows);
  const confirmed = bookings.filter(b => b.status === "confirmed" && (!therapistId || b.therapistId === therapistId));
  const closedRanges = (closedSegs || []).includes("full")
    ? [{ start: 0, end: 1440 }]
    : SEGMENTS.filter(s => (closedSegs || []).includes(s.key));
  const blockRanges = (blocks || [])
    .filter(bl => !therapistId || bl.therapistId === therapistId)
    .map(bl => ({ start: timeToMin(bl.start), end: timeToMin(bl.end) }));
  const allClosedRanges = closedRanges.concat(blockRanges);
  const slots = [];
  const now = new Date();
  const isToday = toDateStr(now) === dateStr;
  const nowMin = now.getHours() * 60 + now.getMinutes();
  windows.forEach(w => {
    const wStart = timeToMin(w.start), wEnd = timeToMin(w.end);
    for (let s = wStart; s + durationMin <= wEnd; s += 30) {
      if (isToday && s <= nowMin) continue;
      const inClosedSeg = allClosedRanges.some(r => s < r.end && r.start < s + durationMin);
      if (inClosedSeg) continue;
      const conflict = confirmed.some(b => {
        const bs = timeToMin(b.start), be = bs + b.duration;
        return s < be && bs < s + durationMin;
      });
      slots.push({ start: s, end: s + durationMin, booked: conflict });
    }
  });
  return slots;
}
function therapistMailOf(b) {
  const t = S.therapists.find(x => x.id === b.therapistId);
  return (t && t.email) || b.therapistEmail || S.adminAuth.adminEmail || "";
}
async function sendEmail(emailjsConfig, { toEmail, name, title, message, replyEmail }) {
  if (!emailjsConfig?.serviceId || !emailjsConfig?.templateId || !emailjsConfig?.publicKey || !toEmail) return false;
  const payload = JSON.stringify({
    service_id: emailjsConfig.serviceId, template_id: emailjsConfig.templateId, user_id: emailjsConfig.publicKey,
    template_params: {
      to_email: toEmail, name: name || "", title: title || "", message: message || "",
      email: replyEmail || "", time: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
    },
  });
  let reason = "";
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
        method: "POST", headers: { "Content-Type": "application/json" }, body: payload, keepalive: true,
      });
      if (res.ok) return true;
      reason = res.status + " " + (await res.text().catch(() => "")).slice(0, 120);
      if (res.status >= 400 && res.status < 500) break;
    } catch (e) { reason = "網路錯誤：" + (e && e.message ? e.message : e); }
    if (attempt === 0) await new Promise(r => setTimeout(r, 1500));
  }
  console.error("email send failed", toEmail, reason);
  try { await addNotification({ type: "email-failed", toEmail, mailTitle: title || "", reason, date: "", start: "", name: name || "", phone: "" }); } catch (e) { console.error(e); }
  return false;
}

// ====== Firestore 存取 ======
async function getConfig(key, fallback) {
  try {
    const snap = await getDoc(doc(db, "config", key));
    return snap.exists() ? snap.data() : fallback;
  } catch (e) { console.error(e); return fallback; }
}
async function setConfig(key, data) {
  try { await setDoc(doc(db, "config", key), data); return true; }
  catch (e) { console.error(e); return false; }
}
async function loadBookingsForDate(dateStr) {
  try {
    const q = query(collection(db, "bookings"), where("date", "==", dateStr));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() }));
  } catch (e) { console.error(e); return []; }
}
async function addBooking(record) {
  const ref = await addDoc(collection(db, "bookings"), record);
  return ref.id;
}
async function cancelBookingDoc(id) {
  await updateDoc(doc(db, "bookings", id), { status: "cancelled" });
}
async function searchBookingsByPhone(phone) {
  try {
    const q = query(collection(db, "bookings"), where("phone", "==", phone), where("status", "==", "confirmed"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  } catch (e) { console.error(e); return []; }
}
async function searchBookingsByDateRange(startDate, endDate) {
  try {
    const q = query(collection(db, "bookings"), where("date", ">=", startDate), where("date", "<=", endDate), orderBy("date"));
    const snap = await getDocs(q);
    return snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));
  } catch (e) { console.error(e); return []; }
}
async function loadBlocksForDate(dateStr) {

async function validateCoupon(code, { phone, birthday, dateStr, duration }) {
  const c = S.coupons.find(x => String(x.code).toUpperCase() === String(code).toUpperCase());
  if (!c || !c.active) return { ok: false, msg: "找不到這個優惠碼，或優惠已停用" };
  if (c.validFrom && dateStr < c.validFrom) return { ok: false, msg: "這個優惠要預約 " + c.validFrom + " 之後的日期才能使用" };
  if (c.validTo && dateStr > c.validTo) return { ok: false, msg: "這個優惠只能用在 " + c.validTo + " 以前的預約" };
  const amount = Number((c.amounts || {})[duration] || 0);
  if (!amount) return { ok: false, msg: "這個優惠不適用於您選的時長" };
  let bday = "";
  if (c.birthday) {
    const cust = await getCustomerDoc(phone);
    bday = (cust && cust.birthdayLocked) ? cust.birthday : (birthday || (cust && cust.birthday) || "");
    if (!bday) return { ok: false, msg: "這是生日優惠，請先在上方填寫您的生日" };
    if (bday.slice(5, 7) !== dateStr.slice(5, 7)) return { ok: false, msg: "生日優惠僅限生日當月使用，預約日期需在您的生日月份" };
  }
  const mine = await searchBookingsByPhone(phone);
  if (c.birthday) {
    if (mine.some(b => b.couponBirthday && b.couponStatus !== "void" && String(b.date).slice(0, 4) === dateStr.slice(0, 4))) return { ok: false, msg: "您今年已經使用過生日優惠囉" };
  } else if (mine.some(b => b.couponId === c.id && b.couponStatus !== "void")) {
    return { ok: false, msg: "這張優惠您已經使用過囉" };
  }
  if (c.maxTotal) {
    const used = await countCouponUse(c.id);
    if (used >= c.maxTotal) return { ok: false, msg: "這張優惠已被領完了" };
  }
  return { ok: true, c, amount, birthday: bday };
}

function calendarMonthHTML(viewState, selected, closedDates, schedule, selectHandler, navHandler, restrictPast) {
  const now = new Date();
  if (viewState.viewYear == null) {
    viewState.viewYear = now.getFullYear();
    viewState.viewMonth = now.getMonth();
  }
  const year = viewState.viewYear, month = viewState.viewMonth;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const firstDay = new Date(year, month, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const isAtCurrentMonth = year === now.getFullYear() && month === now.getMonth();
  let html = `<div class="cal-header">
    <button class="cal-nav" ${restrictPast && isAtCurrentMonth ? "disabled" : ""} onclick="${navHandler}(-1)">‹</button>
    <div class="cal-month-label">${year}年${month + 1}月</div>
    <button class="cal-nav" onclick="${navHandler}(1)">›</button>
  </div>`;
  html += `<div class="cal-weekdays">` + WEEKDAYS.map(w => `<div>${w}</div>`).join("") + `</div>`;
  html += `<div class="cal-grid">`;
  for (let i = 0; i < startWeekday; i++) html += `<div class="cal-cell empty"></div>`;
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const dateStr = toDateStr(dateObj);
    const wk = WEEKDAY_KEYS[dateObj.getDay()];
    const scheduleClosed = !schedule[wk]?.open || parseWindows(schedule[wk]?.windows).length === 0;
    const fullyClosed = isDateFullyClosed(closedDates, dateStr);
    const isPast = restrictPast && dateObj < today;
    const isClosed = scheduleClosed || fullyClosed || isPast;
    const isSel = selected === dateStr;
    html += `<button class="cal-cell ${isSel ? "selected" : ""} ${isClosed ? "closed" : ""}" ${isClosed ? "disabled" : `onclick="${selectHandler}('${dateStr}')"`}>${d}</button>`;
  }
  html += `</div>`;
  return html;
}
function slotGridHTML(slots, selectedSlot, selectHandler) {
  if (slots.length === 0) return `<div class="empty-box">這個時長在此日期沒有可預約的時段，請換個日期或時長試試。</div>`;
  let html = `<div class="slot-grid">`;
  slots.forEach(s => {
    const isSel = selectedSlot && selectedSlot.start === s.start;
    html += `<button class="slot-btn ${s.booked ? "booked" : ""} ${isSel ? "selected" : ""}"
      ${s.booked ? "disabled" : `onclick="${selectHandler}(${s.start})"`}>${minToTime(s.start)}</button>`;
  });
  html += `</div>`;
  return html;
}
function durationRowHTML(current, handler) {
  return `<div class="duration-row">${S.durations.map(d =>
    `<button class="duration-btn ${current === d.minutes ? "active" : ""}" onclick="${handler}(${d.minutes})">${d.minutes} 分鐘<br><span style="font-size:12px;opacity:.85">$${d.price}</span></button>`

function renderCustomerMatches() {
  const a = S.admin;

  html += `<div class="form-field"><input id="admin-email-input" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="你的收件信箱" value="${esc(S.adminAuth.adminEmail)}" /></div>`;
  html += `<div class="form-field"><input id="ej-service" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="EmailJS Service ID" value="${esc(S.adminAuth.emailjs.serviceId)}" /></div>`;
  html += `<div class="form-field"><input id="ej-template" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="EmailJS Template ID" value="${esc(S.adminAuth.emailjs.templateId)}" /></div>`;
  html += `<div class="form-field"><input id="ej-public" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="EmailJS Public Key" value="${esc(S.adminAuth.emailjs.publicKey)}" /></div>`;

  html += `<button class="primary-btn" style="background:#7C9885;margin-top:8px" onclick="adminSendTestEmail()">寄送測試信</button>`;
  if (a.emailTestTip) html += `<div class="saved-tip">${esc(a.emailTestTip)}</div>`;
  html += `<div class="divider"></div>`;
  html += `<div class="section-label">外觀設定</div>`;
  html += `<p class="hint-text">店名跟頁首小字，之後改名或搬家都可以直接在這裡改，不用重新上傳程式碼。</p>`;
  html += `<div class="form-field">🏷️ <input id="studio-name-input" placeholder="店名" value="${esc(S.adminAuth.studioName)}" /></div>`;
  html += `<div class="form-field">📍 <input id="studio-subtitle-input" placeholder="頁首小字（例如：線上預約 · 三重）" value="${esc(S.adminAuth.studioSubtitle)}" /></div>`;
  html += `<button class="primary-btn" onclick="adminSaveStudioInfo()">儲存店名設定</button>`;
  if (a.studioTip) html += `<div class="saved-tip">${esc(a.studioTip)}</div>`;
  html += `<p class="hint-text" style="margin-top:16px">貼上一張已經上傳到網路上的圖片網址（例如 Imgur、Google 相簿的公開連結），就會顯示在頁首的圓形頭像位置。</p>`;

  if (a.logoTip) html += `<div class="saved-tip">${esc(a.logoTip)}</div>`;
  html += `<button class="link-btn" style="margin-top:24px" onclick="adminLogout()">← 登出後台</button>`;
  html += `</div>`;
  return html;
}

function render() {
  if (S.loading) { document.getElementById("app").innerHTML = `<div class="loading-wrap">載入中…</div>`; return; }
  let body = "";
  if (S.tab === "book") body = renderBookTab();
  else if (S.tab === "manage") body = renderManageTab();
  else if (S.tab === "admin") body = S.isAdmin ? renderAdminPanel() : renderAdminLogin();
  document.getElementById("app").innerHTML = renderHeader() + body;
}

window.bookCalNav = (delta) => {
  const b = S.book;
  if (b.viewYear == null) { const now = new Date(); b.viewYear = now.getFullYear(); b.viewMonth = now.getMonth(); }
  let m = b.viewMonth + delta, y = b.viewYear;
  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
  const now = new Date();
  if (y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth())) return;
  b.viewYear = y; b.viewMonth = m;
  render();
};

window.bookSubmit = async () => {
  const name = document.getElementById("bk-name").value.trim();
  const phone = document.getElementById("bk-phone").value.trim();
  const email = document.getElementById("bk-email").value.trim();
  const birthday = document.getElementById("bk-birthday").value;
  const note = document.getElementById("bk-note").value.trim();
  const couponCode = (document.getElementById("bk-coupon")?.value || "").trim().toUpperCase();
  const b = S.book;
  b.draft = { name, phone, email, birthday, note, coupon: couponCode };
  b.error = "";
  if (!name || !phone) { b.error = "請填寫姓名與手機號碼"; render(); return; }
  if (!/^09\d{8}$/.test(phone)) { b.error = "手機號碼格式不正確，請輸入 09 開頭的 10 碼手機號碼"; render(); return; }
  b.submitting = true; render();
  let couponRes = null;
  if (couponCode) {
    couponRes = await validateCoupon(couponCode, { phone, birthday, dateStr: b.selectedDate, duration: b.duration });
    if (!couponRes.ok) { b.error = couponRes.msg; b.submitting = false; render(); return; }
  }
  const latest = await refreshBookings(b.selectedDate);
  const conflict = latest.filter(x => x.status === "confirmed" && x.therapistId === b.therapistId).some(x => {
    const bs = timeToMin(x.start), be = bs + x.duration;
    return b.selectedSlot.start < be && bs < b.selectedSlot.start + b.duration;
  });
  if (conflict) {
    b.error = "這個時段剛被其他客人預約走了，請重新選擇時段";
    b.submitting = false; b.selectedSlot = null; render(); return;
  }
  const therapist = S.therapists.find(t => t.id === b.therapistId) || {};
  const record = {
    date: b.selectedDate, start: minToTime(b.selectedSlot.start), duration: b.duration, price: S.durations.find(d => d.minutes === b.duration)?.price ?? null,
    name, phone, email, note, status: "confirmed", createdAt: Date.now(), arrived: false, paid: false,
    therapistId: b.therapistId, therapistName: therapist.name || "", therapistEmail: therapist.email || "",
    ...(couponRes ? { couponId: couponRes.c.id, couponCode: couponRes.c.code, couponTitle: couponRes.c.title, couponBirthday: !!couponRes.c.birthday, couponAmount: couponRes.amount, couponStatus: "pending" } : {}),
  };
  const id = await addBooking(record);
  S.bookingsCache[b.selectedDate] = [...latest, { id, ...record }];
  await upsertCustomer({ name, phone, email, birthday });
  S.directory = await loadDirectory();
  await addNotification({ type: "new", date: record.date, start: record.start, name, phone, duration: b.duration, therapistName: record.therapistName });
  S.notifications = await loadNotifications();
  const dateLabel = formatDateCN(b.selectedDate);
  if (therapistMailOf(record)) {
    sendEmail(S.adminAuth.emailjs, {
      toEmail: therapistMailOf(record), name, title: `新預約 ${dateLabel} ${record.start}`,
      message: `姓名：${name}\n電話：${phone}\n日期時間：${dateLabel} ${record.start}（${b.duration} 分鐘）\n備註：${note || "無"}${couponRes ? "\n優惠券：" + couponRes.c.title + "（待核對證件，可折抵 $" + couponRes.amount + (couponRes.c.birthday ? "；客人填寫生日：" + (couponRes.birthday || "無") : "") + "）" : ""}`,
      replyEmail: email,
    });
  }
  if (email) {
    sendEmail(S.adminAuth.emailjs, {
      toEmail: email, name, title: "預約成功通知",
      message: `${name} 您好，您的預約已成立。\n師傅：${record.therapistName}\n日期時間：${dateLabel} ${record.start}（${b.duration} 分鐘）\n如需取消，請至預約系統的「查詢/取消」頁面用手機號碼查詢。`,
    });
  }
  b.success = { ...record }; b.submitting = false; b.draft = null;
  render();
};

  const therapist = S.therapists.find(t => t.id === qb.therapistId) || {};

window.adminSendTestEmail = async () => {
  const adminEmail = document.getElementById("admin-email-input").value.trim();
  const serviceId = document.getElementById("ej-service").value.trim();
  const templateId = document.getElementById("ej-template").value.trim();
  const publicKey = document.getElementById("ej-public").value.trim();
  if (!adminEmail || !serviceId || !templateId || !publicKey) {
    S.admin.emailTestTip = "請先填完信箱與三組 EmailJS 值再測試";
    render(); return;
  }
  S.admin.emailTestTip = "測試信寄送中…";
  render();
  try {
    const res = await fetch("https://api.emailjs.com/api/v1.0/email/send", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        service_id: serviceId, template_id: templateId, user_id: publicKey,
        template_params: {
          to_email: adminEmail, name: "測試訊息", title: "這是一封測試信",
          message: "如果你收到這封信，代表 Email 通知設定成功了！",
          email: "", time: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
        },
      }),
    });
    if (res.ok) S.admin.emailTestTip = "已送出，請去信箱確認（含垃圾郵件匣）";
    else {
      const t = await res.text();
      S.admin.emailTestTip = `寄送失敗：${t.slice(0, 150)}`;
    }
  } catch (e) {
    S.admin.emailTestTip = "寄送失敗，請檢查網路連線";
  }
  render();
};

window.adminViewCalNav = (delta) => {
  const a = S.admin;
  if (a.viewYear == null) { const now = new Date(); a.viewYear = now.getFullYear(); a.viewMonth = now.getMonth(); }
  let m = a.viewMonth + delta, y = a.viewYear;
  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
  a.viewYear = y; a.viewMonth = m;
  render();
};

window.adminEditCalNav = (delta) => {
  const e = S.admin.edit;

  if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }

window.adminEditDate = async (dateStr) => {

window.adminEditSlot = (start) => { S.admin.edit.slot = { start }; S.admin.edit.error = ""; render(); };
window.adminSaveEdit = async (id) => {
  const e = S.admin.edit;
  const oldDate = S.admin.viewDate;
  if (!e || !e.slot || e.submitting) return;
  const old = (S.bookingsCache[oldDate] || []).find(x => x.id === id);
  if (!old) return;
  e.submitting = true; e.error = ""; render();
  try {
    const newDate = e.date;
    const fresh = await refreshBookings(newDate);
    const th = S.therapists.find(t => t.id === old.therapistId);
    const others = fresh.filter(x => x.id !== id);
    await ensureBlocks(newDate);
    const slots = generateSlots(newDate, e.duration, (th && th.schedule) || S.schedule || DEFAULT_SCHEDULE, others, old.therapistId, S.closedDates[newDate], S.blocksCache[newDate]);
    const ok = slots.find(x => x.start === e.slot.start && !x.booked);
    if (!ok) { e.submitting = false; e.error = "這個時段剛被其他預約佔用或已不開放，請重新選一個。"; e.slot = null; render(); return; }
    const newStart = minToTime(e.slot.start);
    const price = (S.durations.find(d => d.minutes === e.duration) || {}).price;
    const patch = { date: newDate, start: newStart, duration: e.duration };
    if (price != null) patch.price = price;
    if (old.couponId && old.couponStatus !== "void") {
      const cp = S.coupons.find(x => x.id === old.couponId);
      const amt = cp ? Number((cp.amounts || {})[e.duration] || 0) : Number(old.couponAmount || 0);
      patch.couponAmount = amt;
      if (price != null) {
        patch.originalPrice = price;
        if (old.couponStatus === "redeemed") { patch.discount = Math.min(amt, price); patch.price = price - patch.discount; }
      }
    }
    await updateDoc(doc(db, "bookings", id), patch);
    const changed = old.date !== newDate && oldDate !== newDate || old.start !== newStart || old.duration !== e.duration;
    S.admin.edit = null;
    if (newDate !== oldDate) {
      S.bookingsCache[oldDate] = (S.bookingsCache[oldDate] || []).filter(x => x.id !== id);
      await refreshBookings(newDate);
      S.admin.viewDate = newDate;
      const nd = new Date(newDate + "T00:00:00");
      S.admin.viewYear = nd.getFullYear(); S.admin.viewMonth = nd.getMonth();
    } else {
      S.bookingsCache[newDate] = fresh.map(x => x.id === id ? { ...x, ...patch } : x);
    }
    if (changed) {
      const oldLabel = formatDateCN(oldDate), newLabel = formatDateCN(newDate);
      try {
        await addNotification({ type: "edit-by-admin", date: newDate, start: newStart, name: old.name, phone: old.phone, duration: e.duration, therapistName: old.therapistName });
        S.notifications = await loadNotifications();
      } catch (er) { console.error(er); }
      const msgTxt = `姓名：${old.name}\n電話：${old.phone}\n原預約：${oldLabel} ${old.start}（${old.duration} 分鐘）\n新預約：${newLabel} ${newStart}（${e.duration} 分鐘）`;
      if (therapistMailOf(old)) sendEmail(S.adminAuth.emailjs, { toEmail: therapistMailOf(old), name: old.name, title: `預約修改 ${newLabel} ${newStart}`, message: `後台已修改這筆預約\n${msgTxt}`, replyEmail: old.email });
      if (old.email) sendEmail(S.adminAuth.emailjs, { toEmail: old.email, name: old.name, title: "預約異動通知", message: `${old.name} 您好，您的預約已調整：\n原時間：${oldLabel} ${old.start}（${old.duration} 分鐘）\n新時間：${newLabel} ${newStart}（${e.duration} 分鐘）\n如有疑問請直接與師傅聯繫。` });
    }
  } catch (er) {
    console.error(er);
    e.submitting = false; e.error = "儲存失敗，請檢查網路後再試一次。";
  }
  render();
};
window.adminRedeemCoupon = async (id, date) => {
  const list = S.bookingsCache[date] || [];
  const b = list.find(x => x.id === id);
  if (!b || !b.couponId) return;
  const cust = S.directory.find(c => c.phone === b.phone) || {};
  let bday = "";
  if (b.couponBirthday) {
    const input = prompt("請輸入證件上的生日（格式 2000-05-20）\n預約月份：" + date.slice(5, 7) + " 月", cust.birthday || "");
    if (input === null) return;
    bday = input.trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(bday)) { alert("生日格式不正確，請輸入像 2000-05-20 這樣的格式"); return; }
    if (bday.slice(5, 7) !== date.slice(5, 7)) { alert("證件上的生日不在預約當月，無法折抵。若要取消優惠，請按「取消優惠」。"); return; }
  } else if (!confirm("確認已核對，折抵 $" + b.couponAmount + "？")) return;
  const original = b.originalPrice != null ? b.originalPrice : b.price;
  const discount = Math.min(Number(b.couponAmount || 0), Number(original || 0));
  const patch = { couponStatus: "redeemed", discount, originalPrice: original, price: original != null ? original - discount : null };
  try {
    await updateDoc(doc(db, "bookings", id), patch);
    if (bday) {
      await setDoc(doc(db, "customers", b.phone), { birthday: bday, birthdayLocked: true }, { merge: true });
      S.directory = await loadDirectory();
    }
    S.bookingsCache[date] = list.map(x => x.id === id ? { ...x, ...patch } : x);
  } catch (e) { console.error(e); alert("儲存失敗，請檢查網路後再試一次"); }
  render();
};
window.adminVoidCoupon = async (id, date) => {
  if (!confirm("確定取消這筆預約的優惠？")) return;
  const list = S.bookingsCache[date] || [];
  try {
    await updateDoc(doc(db, "bookings", id), { couponStatus: "void" });
    S.bookingsCache[date] = list.map(x => x.id === id ? { ...x, couponStatus: "void" } : x);
  } catch (e) { console.error(e); alert("儲存失敗，請檢查網路後再試一次"); }
  render();
};
function couponTipFlash(msg) {
  S.admin.couponTip = msg; render();
  setTimeout(() => { S.admin.couponTip = ""; render(); }, 3500);
}
window.adminAddCoupon = async () => {
  const title = document.getElementById("cp-title").value.trim();
  const code = document.getElementById("cp-code").value.trim().toUpperCase();
  const kind = document.getElementById("cp-kind").value;
  if (!title || !code) return couponTipFlash("請填寫名稱與優惠碼");
  if (!/^[A-Z0-9_-]{2,20}$/.test(code)) return couponTipFlash("優惠碼請用英文或數字，2 到 20 個字");
  if (S.coupons.some(c => String(c.code).toUpperCase() === code)) return couponTipFlash("這個優惠碼已經有了，請換一個");
  const amounts = {};
  S.durations.forEach(d => { const v = parseInt(document.getElementById("cp-amt-" + d.minutes)?.value, 10); if (v > 0) amounts[d.minutes] = v; });
  if (!Object.keys(amounts).length) return couponTipFlash("請至少設定一個時長的折抵金額");
  const c = {
    id: "cp" + Date.now().toString(36), code, title, birthday: kind === "birthday", amounts,
    validFrom: document.getElementById("cp-from").value || "", validTo: document.getElementById("cp-to").value || "",
    maxTotal: parseInt(document.getElementById("cp-max").value, 10) || 0, active: true,
  };
  S.coupons.push(c);
  const ok = await setConfig("coupons", { list: S.coupons });
  if (!ok) { S.coupons.pop(); return couponTipFlash("儲存失敗，請檢查網路連線後再試一次"); }
  couponTipFlash("已新增優惠券，按「複製連結文案」就能發給客人");
};
window.adminToggleCoupon = async (id) => {
  const c = S.coupons.find(x => x.id === id);
  if (!c) return;
  c.active = !c.active;
  const ok = await setConfig("coupons", { list: S.coupons });
  if (!ok) { c.active = !c.active; return couponTipFlash("儲存失敗，請檢查網路連線後再試一次"); }
  render();
};
window.adminDeleteCoupon = async (id) => {
  const c = S.coupons.find(x => x.id === id);
  if (!c || !confirm("確定刪除「" + c.title + "」？已預約的客人不受影響。")) return;
  const backup = S.coupons;
  S.coupons = S.coupons.filter(x => x.id !== id);
  const ok = await setConfig("coupons", { list: S.coupons });
  if (!ok) { S.coupons = backup; return couponTipFlash("刪除失敗，請檢查網路連線後再試一次"); }
  render();
};
window.adminCopyCoupon = async (id) => {
  const c = S.coupons.find(x => x.id === id);
  if (!c) return;
  const lines = ["🎁 " + c.title, couponAmountsText(c), c.birthday ? "（需填寫生日，限生日當月預約使用，到店出示證件核對後折抵）" : "（到店核對後折抵）"];
  if (c.validFrom || c.validTo) lines.push("適用預約日期：" + (c.validFrom || "即日起") + " ~ " + (c.validTo || "不限"));
  lines.push("預約連結：" + couponLink(c));
  const text = lines.join("\n");
  let ok = false;
  try { await navigator.clipboard.writeText(text); ok = true; }
  catch (e) {
    try {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); document.body.removeChild(ta);
    } catch (e2) {}
  }
  if (!ok) { prompt("請長按全選後複製下面的文字", text); return; }
  couponTipFlash("已複製，可以直接貼到官方 LINE 發送");
};
window.adminCancelBooking = async (id, date) => {
  const list = S.bookingsCache[date] || [];
  const b = list.find(x => x.id === id);
  await cancelBookingDoc(id);
  S.bookingsCache[date] = list.map(x => x.id === id ? { ...x, status: "cancelled" } : x);
  if (b) {
    await addNotification({ type: "cancel-by-admin", date, start: b.start, name: b.name, phone: b.phone, duration: b.duration, therapistName: b.therapistName });
    S.notifications = await loadNotifications();
    const dateLabel = formatDateCN(date);
    if (therapistMailOf(b)) {
      sendEmail(S.adminAuth.emailjs, {
        toEmail: therapistMailOf(b), name: b.name, title: `預約取消 ${dateLabel} ${b.start}`,
        message: `後台已取消這筆預約\n姓名：${b.name}\n電話：${b.phone}\n原預約時間：${dateLabel} ${b.start}`, replyEmail: b.email,
      });
    }
    if (b.email) {
      sendEmail(S.adminAuth.emailjs, {
        toEmail: b.email, name: b.name, title: "預約異動通知",
        message: `${b.name} 您好，您 ${dateLabel} ${b.start} 的預約已由師傅取消，如有疑問請直接與師傅聯繫。`,
      });
    }
  }
  render();
};

window.adminAddBlock = async () => {
  const b = S.admin.block;
  const start = document.getElementById("block-start-input").value;
  const end = document.getElementById("block-end-input").value;
  if (!b.therapistId) { b.tip = "請先選擇師傅"; render(); return; }
  if (!b.date) { b.tip = "請選擇日期"; render(); return; }
  if (!start || !end || start >= end) { b.tip = "請選擇正確的開始與結束時間"; render(); return; }
  const therapist = S.therapists.find(t => t.id === b.therapistId);
  const rec = { date: b.date, therapistId: b.therapistId, therapistName: therapist?.name || "", start, end, createdAt: Date.now() };
  const id = await addBlockDoc(rec);
  if (!S.blocksCache[b.date]) S.blocksCache[b.date] = [];
  S.blocksCache[b.date].push({ id, ...rec });
  b.start = ""; b.end = ""; b.tip = "已鎖定這個時段";
  render();
  setTimeout(() => { S.admin.block.tip = ""; render(); }, 2500);
};
window.adminRemoveBlock = async (id, date) => {
